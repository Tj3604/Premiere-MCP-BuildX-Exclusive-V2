<!doctype html>
<!--
  TEMPLATE — the standard BuildX end card ("Start Your ADU Journey" checklist), ported
  from the original cta-adu-journey-9x16.html source (rendered as
  buildx-cta-adu-journey-9x16-ig-v3.mov) from CSS keyframes to a GSAP timeline, with the
  same timings. Full-frame — render without --alpha.

  WORDING IS FIXED ON PURPOSE. BuildX never authors a new CTA (CLAUDE.md, brand.md);
  this template exists so the same card can be re-rendered, e.g. at 16:9. To change
  what it says, change it here, deliberately, for every video.

  9:16 keeps everything inside the Instagram transparent rect x52..1027 / y247..1453 and
  left of the action rail (x<930 below y1380), as measured for the original.
-->
<html lang="en"><head><meta charset="UTF-8"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*TOKENS*/
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{width}}px;height:{{height}}px;overflow:hidden;background:var(--panel)}
#root{position:relative;width:{{width}}px;height:{{height}}px;font-family:var(--font);-webkit-font-smoothing:antialiased}
.brand{position:absolute;width:293px;height:55px}
.brand img{width:100%;height:100%;display:block}
.experts{position:absolute;color:var(--gold);font-weight:var(--w-bold);font-size:22px;letter-spacing:.28em;text-transform:uppercase}
.hair{position:absolute;height:3px;background:var(--line);transform-origin:left}
.eyebrow{position:absolute;height:34px;display:flex;align-items:center;gap:22px}
.eyebrow .rule{width:54px;height:4px;background:var(--gold)}
.eyebrow .txt{font-weight:var(--w-bold);font-size:24px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.h{position:absolute;font-weight:var(--w-black);font-size:100px;line-height:1;letter-spacing:-.015em;white-space:nowrap}
.h1{color:var(--white)} .h2{color:var(--gold)}
.sub{position:absolute;color:var(--dim);font-weight:var(--w-bold);font-size:26px;letter-spacing:.18em;text-transform:uppercase}
.row{position:absolute;height:68px;display:flex;align-items:center;gap:24px}
.row .tick{width:50px;height:50px;flex:none;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center}
.row .tick svg{width:30px;height:30px;display:block}
.row .t{font-weight:var(--w-black);font-size:48px;color:var(--white);white-space:nowrap;line-height:1;letter-spacing:-.01em}
.row .t b{color:var(--gold)}
.arrow{position:absolute;width:78px;height:82px}
.arrow img{width:100%;height:100%;display:block}
.btn{position:absolute;height:124px;background:var(--gold);border-radius:18px;display:flex;align-items:center;justify-content:center}
.btn span{font-weight:var(--w-black);font-size:52px;color:var(--ink);letter-spacing:-.01em}

/* 9:16 — positions as measured on the original card */
[data-format="9x16"] .brand{left:110px;top:262px}
[data-format="9x16"] .experts{right:110px;top:274px}
[data-format="9x16"] .hair{left:110px;right:110px;top:344px}
[data-format="9x16"] .eyebrow{left:0;right:0;top:382px;justify-content:center}
[data-format="9x16"] .h{left:0;right:0;text-align:center}
[data-format="9x16"] .h1{top:440px} [data-format="9x16"] .h2{top:548px}
[data-format="9x16"] .sub{left:0;right:0;top:676px;text-align:center}
[data-format="9x16"] .row{left:110px}
[data-format="9x16"] .r1{top:738px} [data-format="9x16"] .r2{top:848px}
[data-format="9x16"] .r3{top:958px} [data-format="9x16"] .r4{top:1068px}
[data-format="9x16"] .arrow{left:501px;top:1170px}
[data-format="9x16"] .btn{left:165px;width:750px;top:1272px}

/* 16:9 — headline left, checklist and button right, inside title-safe */
[data-format="16x9"] .brand{left:150px;top:130px}
[data-format="16x9"] .experts{right:150px;top:142px}
[data-format="16x9"] .hair{left:150px;right:150px;top:212px}
[data-format="16x9"] .eyebrow{left:150px;top:330px}
[data-format="16x9"] .h{left:150px}
[data-format="16x9"] .h1{top:392px} [data-format="16x9"] .h2{top:500px}
[data-format="16x9"] .sub{left:150px;top:632px}
[data-format="16x9"] .row{left:1010px}
[data-format="16x9"] .row .t{font-size:40px}
[data-format="16x9"] .r1{top:300px} [data-format="16x9"] .r2{top:392px}
[data-format="16x9"] .r3{top:484px} [data-format="16x9"] .r4{top:576px}
[data-format="16x9"] .arrow{left:1351px;top:664px}
[data-format="16x9"] .btn{left:1010px;width:760px;top:766px}
</style></head><body>
<div id="root" data-format="{{format}}" data-composition-id="root" data-start="0" data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}">
  <div class="brand" id="brand"><img src="assets/cta-logo.png" alt=""></div>
  <div class="experts" id="experts">Your ADU Experts</div>
  <div class="hair" id="hair"></div>
  <div class="eyebrow" id="eyebrow"><span class="rule"></span><span class="txt">Your Next Step</span><span class="rule"></span></div>
  <div class="h h1" id="h1">START YOUR</div>
  <div class="h h2" id="h2">ADU JOURNEY</div>
  <div class="sub" id="sub">Everything on BuildX.com</div>
  <div class="row r1" id="r1"><span class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="#111" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="t">Private Showings</span></div>
  <div class="row r2" id="r2"><span class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="#111" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="t">Home Tours</span></div>
  <div class="row r3" id="r3"><span class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="#111" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="t"><b>FREE</b> Project Conversations</span></div>
  <div class="row r4" id="r4"><span class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="#111" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="t">Custom Floor Plans &amp; Pricing</span></div>
  <div class="arrow" id="arrow"><img src="assets/cta-arrow.png" alt=""></div>
  <div class="btn" id="btn"><span>Visit BuildX.com</span></div>
<script>
window.__timelines=window.__timelines||{};
var D={{duration}}, O="cubic-bezier(.2,.8,.3,1)";
var tl=gsap.timeline({paused:true});
/* Same delays and lengths as the original CSS keyframes. */
tl.fromTo("#brand",{opacity:0},{opacity:1,duration:.40,ease:"power1.out"},0.10)
  .fromTo("#experts",{opacity:0},{opacity:1,duration:.40,ease:"power1.out"},0.18)
  .fromTo("#hair",{scaleX:0},{scaleX:1,duration:.55,ease:"power3.out"},0.26)
  .fromTo("#eyebrow",{opacity:0},{opacity:1,duration:.40,ease:"power1.out"},0.34)
  .fromTo("#h1",{opacity:0,y:24},{opacity:1,y:0,duration:.40,ease:"power3.out"},0.50)
  .fromTo("#h2",{opacity:0,y:24},{opacity:1,y:0,duration:.40,ease:"power3.out"},0.72)
  .fromTo("#sub",{opacity:0},{opacity:1,duration:.40,ease:"power1.out"},0.96)
  .fromTo("#r1",{opacity:0,x:-26},{opacity:1,x:0,duration:.44,ease:"power3.out"},1.16)
  .fromTo("#r2",{opacity:0,x:-26},{opacity:1,x:0,duration:.44,ease:"power3.out"},1.34)
  .fromTo("#r3",{opacity:0,x:-26},{opacity:1,x:0,duration:.44,ease:"power3.out"},1.52)
  .fromTo("#r4",{opacity:0,x:-26},{opacity:1,x:0,duration:.44,ease:"power3.out"},1.70)
  .fromTo("#arrow",{opacity:0},{opacity:1,duration:.40,ease:"power1.out"},1.96)
  .fromTo("#btn",{opacity:0,scale:.90},{opacity:1,scale:1,duration:.42,ease:"back.out(2)"},2.10);
/* The arrow bobs 12px every 1.333s until the end — a finite repeat keeps renders deterministic. */
var half=0.6665, reps=Math.max(0,Math.floor((D-2.36)/half)-1);
tl.to("#arrow",{y:12,duration:half,ease:"sine.inOut",yoyo:true,repeat:reps},2.36);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
