<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.82);--black:#0B0B0B;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:1080px;height:1920px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:51px;right:51px;top:220px;background:var(--panel);
  border:2px solid rgba(217,164,65,.35);border-radius:26px;padding:38px 44px 44px}
.eyebrow{color:var(--gold);font-weight:700;font-size:30px;letter-spacing:8px;text-transform:uppercase;text-align:center}
.row{display:flex;align-items:center;gap:22px;margin-top:26px}
.tick{width:18px;height:18px;background:var(--gold);border-radius:4px;flex:0 0 18px}
.item{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:72px;line-height:1.04;text-transform:uppercase}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920" data-duration="23.2">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">AT THE ZONING BOARD</div>
    <div class="row" id="r1"><div class="tick"></div><div class="item">Everybody was there</div></div>
    <div class="row" id="r2"><div class="tick"></div><div class="item">Land surveyors</div></div>
    <div class="row" id="r3"><div class="tick"></div><div class="item">Answers to every question</div></div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
/* each lands after it is spoken: 10.34 / 11.3 / 13.5-16.5 */
tl.fromTo("#card",{opacity:0,y:40},{opacity:1,y:0,duration:.55,ease:E},9.70)
  .fromTo("#eyebrow",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:E},9.86)
  .fromTo("#r1",{opacity:0,y:26},{opacity:1,y:0,duration:.5,ease:E},11.20)
  .fromTo("#r2",{opacity:0,y:26},{opacity:1,y:0,duration:.5,ease:E},13.60)
  .fromTo("#r3",{opacity:0,y:26},{opacity:1,y:0,duration:.5,ease:E},16.90)
  .to("#card",{opacity:0,y:-24,duration:.45,ease:"power2.in"},20.60)
  .set("#card",{opacity:0,visibility:"hidden"},21.15);
gsap.set(["#card","#r1","#r2","#r3"],{opacity:0});
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
