<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.82);}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1728px;height:3072px;overflow:hidden;background:transparent}
#root{position:relative;width:1728px;height:3072px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:82px;right:82px;top:430px;
  background:var(--panel);border:3px solid rgba(217,164,65,.35);border-radius:42px;
  padding:58px 70px 64px;text-align:center}
.eyebrow{color:var(--gold);font-weight:700;font-size:46px;letter-spacing:13px;text-transform:uppercase;margin-bottom:34px}
.line{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:104px;line-height:1.14;text-transform:uppercase}
.line em{font-style:normal;color:var(--gold)}
.rule{height:6px;width:280px;background:var(--gold);border-radius:3px;margin:34px auto 30px;transform-origin:center}
.total{font-family:'Anton','Arial Black',sans-serif;color:var(--gold);font-size:168px;line-height:1;text-transform:uppercase}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1728" data-height="3072" data-duration="8.6">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">HOW LONG IT TAKES</div>
    <div class="line" id="l1"><em>4 MONTHS</em> TO BUILD</div>
    <div class="line" id="l2">+ <em>4 MONTHS</em> FOR PERMITS</div>
    <div class="rule" id="rule"></div>
    <div class="total" id="total">8–9 MONTHS</div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
tl.fromTo("#card",{opacity:0,y:44},{opacity:1,y:0,duration:.55,ease:E},0.00)
  .fromTo("#eyebrow",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:E},0.14)
  .fromTo("#l1",{opacity:0,x:-36},{opacity:1,x:0,duration:.5,ease:E},1.12)
  .fromTo("#l2",{opacity:0,x:-36},{opacity:1,x:0,duration:.5,ease:E},4.20)
  .fromTo("#rule",{scaleX:0},{scaleX:1,duration:.5,ease:E},5.60)
  /* total lands on "so eight to nine months", 5.72s in */
  .fromTo("#total",{opacity:0,scale:.88},{opacity:1,scale:1,duration:.55,ease:"back.out(1.6)"},5.90)
  .to("#card",{opacity:0,y:-26,duration:.42,ease:"power2.in"},8.05)
  .set("#card",{opacity:0,visibility:"hidden"},8.50);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
