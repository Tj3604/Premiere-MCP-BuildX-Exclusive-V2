<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.82);}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1728px;height:3072px;overflow:hidden;background:transparent}
#root{position:relative;width:1728px;height:3072px;font-family:'Archivo',Arial,sans-serif}
/* upper third — the lower half is reserved for Tom's captions */
.card{position:absolute;left:82px;right:82px;top:430px;
  background:var(--panel);border:3px solid rgba(217,164,65,.35);border-radius:42px;
  padding:64px 70px 70px;text-align:center}
.eyebrow{color:var(--gold);font-weight:700;font-size:48px;letter-spacing:13px;text-transform:uppercase}
.headline{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:190px;line-height:1.02;
  text-transform:uppercase;margin-top:26px;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.headline em{font-style:normal;color:var(--gold)}
.rule{height:6px;width:240px;background:var(--gold);border-radius:3px;margin:40px auto 34px;transform-origin:center}
.sub{color:rgba(255,255,255,.82);font-weight:700;font-size:44px;letter-spacing:5px;text-transform:uppercase}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1728" data-height="3072" data-duration="5.5">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">THE REAL NUMBER</div>
    <div class="headline" id="headline"><em>$440K</em> — <em>$460K</em></div>
    <div class="rule" id="rule"></div>
    <div class="sub" id="sub">ALL IN &nbsp;·&nbsp; 900 SQ FT &nbsp;·&nbsp; 1 BED 1 BATH</div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
tl.fromTo("#card",{opacity:0,y:44},{opacity:1,y:0,duration:.55,ease:E},0.00)
  .fromTo("#eyebrow",{opacity:0,y:22},{opacity:1,y:0,duration:.5,ease:E},0.16)
  .fromTo("#headline",{opacity:0,y:34},{opacity:1,y:0,duration:.6,ease:E},0.32)
  .fromTo("#rule",{scaleX:0},{scaleX:1,duration:.5,ease:E},0.62)
  .fromTo("#sub",{opacity:0,y:18},{opacity:1,y:0,duration:.5,ease:E},0.78)
  .to("#card",{opacity:0,y:-26,duration:.42,ease:"power2.in"},4.95)
  .set("#card",{opacity:0,visibility:"hidden"},5.40);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
