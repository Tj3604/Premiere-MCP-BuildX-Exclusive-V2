<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.82);}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:1080px;height:1920px;font-family:'Archivo',Arial,sans-serif}
/* upper third — the lower half is reserved for captions */
.card{position:absolute;left:51px;right:51px;top:230px;
  background:var(--panel);border:2px solid rgba(217,164,65,.35);border-radius:26px;
  padding:40px 44px 46px}
.eyebrow{color:var(--gold);font-weight:700;font-size:30px;letter-spacing:8px;text-transform:uppercase;text-align:center}
.list{margin-top:32px}
.row{display:flex;align-items:center;gap:20px;margin-top:24px}
.row:first-child{margin-top:0}
.tick{width:16px;height:16px;background:var(--gold);border-radius:3px;flex:0 0 16px}
.item{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:82px;line-height:1.05;
  text-transform:uppercase;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.rule{height:4px;width:150px;background:var(--gold);border-radius:2px;margin:34px auto 20px;transform-origin:center}
.kicker{color:var(--gold);font-weight:700;font-size:26px;letter-spacing:3px;text-transform:uppercase;text-align:center}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920" data-duration="23.2">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">BUILT TO STAY IN</div>
    <div class="list">
      <div class="row" id="r1"><div class="tick"></div><div class="item">All one floor</div></div>
      <div class="row" id="r2"><div class="tick"></div><div class="item">Accessible bath</div></div>
    </div>
    <div class="rule" id="rule"></div>
    <div class="kicker" id="kicker">BuildX. Just build baby.</div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
/* Each item lands after it is spoken: "one floor" 11.78s, "bathroom" 15.5s. */
tl.fromTo("#card",{opacity:0,y:44},{opacity:1,y:0,duration:.55,ease:E},11.70)
  .fromTo("#eyebrow",{opacity:0,y:22},{opacity:1,y:0,duration:.5,ease:E},11.86)
  .fromTo("#r1",{opacity:0,y:28},{opacity:1,y:0,duration:.55,ease:E},12.10)
  .fromTo("#r2",{opacity:0,y:28},{opacity:1,y:0,duration:.55,ease:E},15.60)
  .fromTo("#rule",{scaleX:0},{scaleX:1,duration:.5,ease:E},16.30)
  .fromTo("#kicker",{opacity:0,y:18},{opacity:1,y:0,duration:.5,ease:E},16.50)
  .to("#card",{opacity:0,y:-26,duration:.45,ease:"power2.in"},22.40)
  .set("#card",{opacity:0,visibility:"hidden"},22.95);
gsap.set(["#card","#r1","#r2"],{opacity:0});
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
