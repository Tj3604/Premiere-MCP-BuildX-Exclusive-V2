<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.84);}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:relative;width:1920px;height:1080px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:90px;bottom:92px;max-width:1120px;
  background:var(--panel);border-left:10px solid var(--gold);border-radius:14px;padding:32px 46px 36px}
.eyebrow{color:var(--gold);font-weight:700;font-size:26px;letter-spacing:8px;text-transform:uppercase}
.quote{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:76px;line-height:1.06;
  text-transform:uppercase;margin-top:12px}
.quote em{font-style:normal;color:var(--gold)}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="4.5">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">THE PART NOBODY BUDGETS FOR</div>
    <div class="quote" id="quote">They're in their room.<br>They're <em>alone a lot</em>.</div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
tl.fromTo("#card",{opacity:0,x:-46},{opacity:1,x:0,duration:.5,ease:E},0.00)
  .fromTo("#eyebrow",{opacity:0,y:14},{opacity:1,y:0,duration:.4,ease:E},0.14)
  .fromTo("#quote",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:E},0.40)
  .to("#card",{opacity:0,x:-34,duration:.42,ease:"power2.in"},3.95)
  .set("#card",{opacity:0,visibility:"hidden"},4.40);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
