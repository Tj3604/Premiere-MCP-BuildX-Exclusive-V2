<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.84);}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:relative;width:1920px;height:1080px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:90px;bottom:92px;max-width:1180px;
  background:var(--panel);border-left:10px solid var(--gold);border-radius:14px;padding:32px 46px 36px}
.eyebrow{color:var(--gold);font-weight:700;font-size:28px;letter-spacing:8px;text-transform:uppercase;margin-bottom:22px}
.row{display:flex;align-items:center;gap:22px;margin-top:16px}
.tick{width:44px;height:44px;flex:0 0 44px;border-radius:10px;border:3px solid var(--gold);position:relative}
.tick svg{position:absolute;inset:0;width:100%;height:100%}
.tick path{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:64;stroke-dashoffset:64}
.txt{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:52px;text-transform:uppercase;line-height:1.05}
.txt em{font-style:normal;color:var(--gold)}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="8.0">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">WHAT THE TOWN HAS TO SHOW YOU</div>
    <div class="row" id="r1"><div class="tick"><svg viewBox="0 0 44 44"><path d="M10 23 L19 32 L34 13"/></svg></div><div class="txt">Every permit &mdash; <em>last 10 years</em></div></div>
    <div class="row" id="r2"><div class="tick"><svg viewBox="0 0 44 44"><path d="M10 23 L19 32 L34 13"/></svg></div><div class="txt">They <em>have to</em> show you</div></div>
    <div class="row" id="r3"><div class="tick"><svg viewBox="0 0 44 44"><path d="M10 23 L19 32 L34 13"/></svg></div><div class="txt">You can <em>photograph</em> them</div></div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
/* rows land after he says each: "last 10 years" +2.5, "have to show me" +3.7, "take pictures" +4.5 */
var B=[2.50,3.70,4.50];
tl.fromTo("#card",{opacity:0,x:-46},{opacity:1,x:0,duration:.5,ease:E},0.00)
  .fromTo("#eyebrow",{opacity:0,y:14},{opacity:1,y:0,duration:.4,ease:E},0.16);
for(var i=0;i<B.length;i++){
  var id="#r"+(i+1);
  tl.set(id,{opacity:0},0);
  tl.to(id,{opacity:1,duration:.30,ease:E},B[i]);
  tl.fromTo(id+" .tick path",{strokeDashoffset:64},{strokeDashoffset:0,duration:.32,ease:"power2.out"},B[i]);
}
tl.to("#card",{opacity:0,x:-34,duration:.42,ease:"power2.in"},7.45)
  .set("#card",{opacity:0,visibility:"hidden"},7.90);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
