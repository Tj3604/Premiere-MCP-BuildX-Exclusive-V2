<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--black:#0B0B0B;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1728px;height:3072px;overflow:hidden;background:transparent}
#root{position:relative;width:1728px;height:3072px;font-family:'Archivo',Arial,sans-serif}

/* full-frame wash so the payoff owns the screen */
.wash{position:absolute;inset:0;background:rgba(0,0,0,0.74)}

.stack{position:absolute;left:82px;right:82px;top:620px;text-align:center}

.l1{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:150px;line-height:1.02;text-transform:uppercase}
.l2{font-family:'Anton','Arial Black',sans-serif;color:rgba(255,255,255,.62);font-size:112px;line-height:1.05;
  text-transform:uppercase;margin-top:14px}

.rule{height:8px;width:0;background:var(--gold);border-radius:4px;margin:56px auto 52px}

.l3{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:132px;line-height:1.02;text-transform:uppercase}

.slabwrap{margin-top:26px;display:flex;justify-content:center}
.slab{background:var(--gold);border-radius:26px;padding:22px 54px 30px;
  box-shadow:0 30px 90px rgba(217,164,65,.28)}
.slab span{font-family:'Anton','Arial Black',sans-serif;color:var(--black);font-size:268px;line-height:1;
  text-transform:uppercase;display:block}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1728" data-height="3072" data-duration="6.6">
  <div class="wash" id="wash"></div>
  <div class="stack">
    <div class="l1" id="l1">ZONING &amp; PERMITS</div>
    <div class="l2" id="l2">Are one thing</div>
    <div class="rule" id="rule"></div>
    <div class="l3" id="l3">They can't dictate</div>
    <div class="slabwrap"><div class="slab" id="slab"><span>Ownership</span></div></div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});

tl.fromTo("#wash",{opacity:0},{opacity:1,duration:.42,ease:"power2.out"},0.00)
  /* "Zoning" is spoken at +0.28 */
  .fromTo("#l1",{opacity:0,y:44,scale:.94},{opacity:1,y:0,scale:1,duration:.5,ease:E},0.32)
  /* "one thing" at +1.46 */
  .fromTo("#l2",{opacity:0,y:30},{opacity:1,y:0,duration:.45,ease:E},1.55)
  .to("#rule",{width:340,duration:.45,ease:E},2.30)
  /* "they can't dictate" at +2.47 */
  .fromTo("#l3",{opacity:0,y:34},{opacity:1,y:0,duration:.45,ease:E},2.75)
  /* "ownership" lands at +3.11 — slam it in */
  .fromTo("#slab",{opacity:0,scale:.55,rotation:-3},
                  {opacity:1,scale:1,rotation:0,duration:.62,ease:"back.out(2.2)"},3.15)
  /* a quick punch so it reads as an exclamation, not a caption */
  .to("#slab",{scale:1.055,duration:.13,ease:"power2.out"},3.80)
  .to("#slab",{scale:1,duration:.22,ease:"power2.inOut"},3.93)
  .to(["#l1","#l2","#rule","#l3","#slab"],{opacity:0,y:-24,duration:.4,ease:"power2.in",stagger:.03},5.85)
  .to("#wash",{opacity:0,duration:.45,ease:"power2.in"},6.00)
  .set("#wash",{opacity:0,visibility:"hidden"},6.50);

window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
