<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.84);--red:#D64A4A;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:relative;width:1920px;height:1080px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:90px;bottom:92px;max-width:1180px;
  background:var(--panel);border-left:10px solid var(--red);border-radius:14px;padding:32px 46px 36px}
.eyebrow{color:var(--red);font-weight:700;font-size:28px;letter-spacing:8px;text-transform:uppercase}
.headline{font-family:'Anton','Arial Black',sans-serif;color:var(--red);font-size:104px;line-height:1;
  text-transform:uppercase;margin-top:12px}
.split{height:3px;background:rgba(255,255,255,.18);margin:26px 0 22px;transform-origin:left center}
.hic{display:flex;align-items:baseline;gap:24px}
.hiclab{color:rgba(255,255,255,.82);font-weight:700;font-size:32px;letter-spacing:4px;text-transform:uppercase;line-height:1.2}
.hicnum{font-family:'Anton','Arial Black',sans-serif;color:var(--gold);font-size:80px;line-height:1}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="10.0">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">HER RECOURSE</div>
    <div class="headline" id="headline">None. Zero.</div>
    <div class="split" id="split"></div>
    <div class="hic" id="hic">
      <div class="hicnum">$5,000</div>
      <!-- he explicitly hedges on whether the fund has ever paid out, so that claim stays off screen -->
      <div class="hiclab">Maximum payout<br>from the state HIC fund</div>
    </div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
/* "None." at +0.0, "Zero." at +0.97, "$5,000" at +7.39 */
tl.fromTo("#card",{opacity:0,x:-46},{opacity:1,x:0,duration:.5,ease:E},0.00)
  .fromTo("#eyebrow",{opacity:0,y:14},{opacity:1,y:0,duration:.4,ease:E},0.14)
  .set(["#headline","#split","#hic"],{opacity:0},0)
  .fromTo("#headline",{opacity:0,scale:.9,transformOrigin:"0% 50%"},
                      {opacity:1,scale:1,duration:.5,ease:"back.out(1.8)"},1.10)
  .to("#split",{opacity:1,duration:.3},7.10)
  .fromTo("#split",{scaleX:0},{scaleX:1,duration:.45,ease:E},7.10)
  .fromTo("#hic",{opacity:0,y:18},{opacity:1,y:0,duration:.45,ease:E},7.60)
  .to("#card",{opacity:0,x:-34,duration:.42,ease:"power2.in"},9.45)
  .set("#card",{opacity:0,visibility:"hidden"},9.90);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
