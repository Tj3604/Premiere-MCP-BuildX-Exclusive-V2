<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--black:#0B0B0B;--white:#FFFFFF;--panel:rgba(11,11,11,0.82);}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:1080px;height:1920px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:108px;right:108px;bottom:300px;
  background:var(--panel);border:2px solid rgba(217,164,65,.35);border-radius:26px;
  padding:44px 46px 46px;}
.eyebrow{color:var(--gold);font-weight:700;font-size:30px;letter-spacing:8px;text-transform:uppercase;margin-bottom:18px}
.headline{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:82px;line-height:1.05;
  text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.55)}
.headline em{font-style:normal;color:var(--gold)}
.rule{height:4px;background:var(--gold);border-radius:2px;margin:30px 0 26px;transform-origin:left center}
.stat{font-family:'Anton','Arial Black',sans-serif;color:var(--gold);font-size:104px;line-height:1;text-transform:uppercase}
.statlabel{color:rgba(255,255,255,.75);font-weight:700;font-size:32px;letter-spacing:3px;text-transform:uppercase;margin-top:12px}
.note{color:rgba(255,255,255,.6);font-weight:500;font-size:29px;line-height:1.35;margin-top:22px}
.tag{position:absolute;left:0;right:0;bottom:150px;text-align:center;color:var(--gold);
  font-family:'Anton','Arial Black',sans-serif;font-size:36px;letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 2px 16px rgba(0,0,0,.6)}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920" data-duration="6">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">SEPTIC</div>
    <div class="headline" id="headline">TIE INTO YOUR<br><em>EXISTING</em> SEPTIC</div>
    <div class="rule" id="rule"></div>
    <div class="stat" id="stat">ENGINEERED</div>
    <div class="statlabel" id="statlabel">BUILDX HANDLES IT</div>
    <div class="note" id="note">Pitch and setbacks designed for you</div>
  </div>
  <div class="tag" id="tag">BuildX. Just build baby.</div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
tl.fromTo("#card",{opacity:0,y:50},{opacity:1,y:0,duration:.6,ease:E},0.10)
  .fromTo("#eyebrow",{opacity:0,y:30},{opacity:1,y:0,duration:.6,ease:E},0.20)
  .fromTo("#headline",{opacity:0,y:40},{opacity:1,y:0,duration:.7,ease:E},0.45)
  .fromTo("#rule",{scaleX:0},{scaleX:1,duration:.6,ease:E},0.85)
  .fromTo("#stat",{opacity:0,y:34},{opacity:1,y:0,duration:.6,ease:E},1.05)
  .fromTo("#statlabel",{opacity:0,y:24},{opacity:1,y:0,duration:.5,ease:E},1.30)
  .fromTo("#note",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:E},1.50)
  .fromTo("#tag",{opacity:0,y:24},{opacity:1,y:0,duration:.6,ease:E},1.80)
  .to("#card",{opacity:0,y:-30,duration:.45,ease:"power2.in"},5.35)
  .to("#tag",{opacity:0,duration:.45,ease:"power2.in"},5.35)
  .set("#card",{opacity:0,visibility:"hidden"},5.85)
  .set("#tag",{opacity:0,visibility:"hidden"},5.85);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
