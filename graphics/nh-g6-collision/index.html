<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.84);--black:#0B0B0B;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:relative;width:1920px;height:1080px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:90px;bottom:92px;max-width:1220px;
  background:var(--panel);border-left:10px solid var(--gold);border-radius:14px;padding:32px 46px 36px}
.eyebrow{color:var(--gold);font-weight:700;font-size:26px;letter-spacing:8px;text-transform:uppercase}
.line{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:74px;line-height:1.05;
  text-transform:uppercase;margin-top:12px}
.line em{font-style:normal;color:var(--gold)}
.bar{margin-top:22px;display:table;background:var(--gold);border-radius:10px;padding:10px 26px 14px}
.bar span{font-family:'Anton','Arial Black',sans-serif;color:var(--black);font-size:52px;text-transform:uppercase;line-height:1}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="5.2">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">THE FASTEST GROWING GROUP</div>
    <div class="line" id="line"><em>Over 60</em></div>
    <div class="bar" id="bar"><span>There's a collision course coming</span></div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
/* "over 60" lands at +0.0 ; "collision course coming" at +3.0 */
tl.fromTo("#card",{opacity:0,x:-46},{opacity:1,x:0,duration:.45,ease:E},0.00)
  .fromTo("#eyebrow",{opacity:0,y:14},{opacity:1,y:0,duration:.4,ease:E},0.10)
  .fromTo("#line",{opacity:0,y:18},{opacity:1,y:0,duration:.45,ease:E},0.30)
  .set("#bar",{opacity:0},0)
  .fromTo("#bar",{opacity:0,scale:.9,transformOrigin:"0% 50%"},
                 {opacity:1,scale:1,duration:.45,ease:"back.out(1.9)"},3.20)
  .to("#card",{opacity:0,x:-34,duration:.40,ease:"power2.in"},4.70)
  .set("#card",{opacity:0,visibility:"hidden"},5.10);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
