<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.84);}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:relative;width:1920px;height:1080px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:90px;bottom:92px;max-width:1160px;
  background:var(--panel);border-left:10px solid var(--gold);border-radius:14px;padding:32px 46px 36px}
.q{font-family:'Anton','Arial Black',sans-serif;color:rgba(255,255,255,.82);font-size:62px;line-height:1.06;text-transform:uppercase}
.a{font-family:'Anton','Arial Black',sans-serif;color:var(--gold);font-size:104px;line-height:1;
  text-transform:uppercase;margin-top:10px}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="4.0">
  <div class="card" id="card">
    <div class="q" id="q">Is it better than being at home?</div>
    <div class="a" id="a">No.</div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
tl.fromTo("#card",{opacity:0,x:-46},{opacity:1,x:0,duration:.45,ease:E},0.00)
  .fromTo("#q",{opacity:0,y:16},{opacity:1,y:0,duration:.4,ease:E},0.12)
  /* he answers "No" at +0.0 — the word lands as the card arrives */
  .fromTo("#a",{opacity:0,scale:.88,transformOrigin:"0% 50%"},
               {opacity:1,scale:1,duration:.45,ease:"back.out(2)"},0.55)
  .to("#card",{opacity:0,x:-34,duration:.42,ease:"power2.in"},3.45)
  .set("#card",{opacity:0,visibility:"hidden"},3.90);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
