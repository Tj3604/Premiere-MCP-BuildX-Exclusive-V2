<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.84);--black:#0B0B0B;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:relative;width:1920px;height:1080px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:90px;bottom:92px;max-width:1240px;
  background:var(--panel);border-left:10px solid var(--gold);border-radius:14px;padding:32px 46px 36px}
.eyebrow{color:var(--gold);font-weight:700;font-size:28px;letter-spacing:8px;text-transform:uppercase;margin-bottom:22px}
.amts{display:flex;align-items:center;gap:26px}
.amt{font-family:'Anton','Arial Black',sans-serif;color:var(--gold);font-size:88px;line-height:1}
.arrow{color:rgba(255,255,255,.5);font-size:52px;font-weight:700;line-height:1}
.payoff{margin-top:26px;display:inline-block;background:var(--gold);border-radius:10px;padding:12px 26px 16px}
.payoff span{font-family:'Anton','Arial Black',sans-serif;color:var(--black);font-size:60px;text-transform:uppercase;line-height:1}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="6.5">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">HOW THE SCAM STARTS</div>
    <div class="amts">
      <div class="amt" id="a1">$10,000</div>
      <div class="arrow" id="x1">&rarr;</div>
      <div class="amt" id="a2">$20,000</div>
      <div class="arrow" id="x2">&rarr;</div>
      <div class="amt" id="a3">$30,000</div>
    </div>
    <div class="payoff" id="payoff"><span>Then the game starts</span></div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
/* he says each figure at +0.28, +0.98, +1.69; "the game starts" at +2.72 */
tl.fromTo("#card",{opacity:0,x:-46},{opacity:1,x:0,duration:.5,ease:E},0.00)
  .fromTo("#eyebrow",{opacity:0,y:14},{opacity:1,y:0,duration:.4,ease:E},0.14)
  .set(["#a1","#a2","#a3","#x1","#x2","#payoff"],{opacity:0},0)
  .to("#a1",{opacity:1,duration:.26,ease:E},0.45)
  .to("#x1",{opacity:1,duration:.20,ease:E},1.05)
  .to("#a2",{opacity:1,duration:.26,ease:E},1.15)
  .to("#x2",{opacity:1,duration:.20,ease:E},1.80)
  .to("#a3",{opacity:1,duration:.26,ease:E},1.90)
  .fromTo("#payoff",{opacity:0,scale:.9,transformOrigin:"0% 50%"},
                    {opacity:1,scale:1,duration:.45,ease:"back.out(1.9)"},3.00)
  .to("#card",{opacity:0,x:-34,duration:.42,ease:"power2.in"},5.95)
  .set("#card",{opacity:0,visibility:"hidden"},6.40);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
