<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--white:#FFFFFF;--panel:rgba(11,11,11,0.82);--black:#0B0B0B;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:1080px;height:1920px;font-family:'Archivo',Arial,sans-serif}
.card{position:absolute;left:108px;right:108px;top:1180px;
  background:var(--panel);border:2px solid rgba(217,164,65,.35);border-radius:26px;
  padding:34px 44px 38px;text-align:center}
.eyebrow{color:var(--gold);font-weight:700;font-size:30px;letter-spacing:8px;text-transform:uppercase}
.name{font-family:'Anton','Arial Black',sans-serif;color:var(--white);font-size:112px;line-height:1.05;
  text-transform:uppercase;margin-top:14px;white-space:nowrap;text-shadow:0 4px 20px rgba(0,0,0,.5)}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920" data-duration="5.5">
  <div class="card" id="card">
    <div class="eyebrow" id="eyebrow">BUILDX CUSTOMER</div>
    <div class="name" id="name">MIKE LEMON</div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var E="power3.out";
var tl=gsap.timeline({paused:true});
tl.fromTo("#card",{opacity:0,y:44},{opacity:1,y:0,duration:.55,ease:E},0.00)
  .fromTo("#eyebrow",{opacity:0,y:22},{opacity:1,y:0,duration:.5,ease:E},0.16)
  .fromTo("#name",{opacity:0,y:34},{opacity:1,y:0,duration:.6,ease:E},0.32)
  .to("#card",{opacity:0,y:-26,duration:.42,ease:"power2.in"},4.95)
  .set("#card",{opacity:0,visibility:"hidden"},5.40);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
