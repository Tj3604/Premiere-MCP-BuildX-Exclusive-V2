<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0B}
#root{position:relative;width:1080px;height:1920px;font-family:'Archivo',Arial,sans-serif;overflow:hidden}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0}
.shot img{position:absolute;top:50%;left:50%;width:auto;height:125%;transform:translate(-50%,-50%);will-change:transform}
.vig{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,11,.5) 0%,rgba(11,11,11,0) 26%,rgba(11,11,11,0) 64%,rgba(11,11,11,.85) 100%)}
.label{position:absolute;left:60px;bottom:190px;right:60px}
.eyebrow{color:var(--gold);font-weight:700;font-size:30px;letter-spacing:8px;text-transform:uppercase;margin-bottom:14px}
.title{font-family:'Anton','Arial Black',sans-serif;color:#fff;font-size:80px;line-height:1.02;text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.title em{font-style:normal;color:var(--gold)}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920" data-duration="8">
  <div class="shot" id="s1"><img id="i1" src="assets/w1.webp"></div>
  <div class="shot" id="s2"><img id="i2" src="assets/w2.webp"></div>
  <div class="shot" id="s3"><img id="i3" src="assets/w3.webp"></div>
  <div class="vig"></div>
  <div class="label">
    <div class="eyebrow" id="eb">Real BuildX ADUs</div>
    <div class="title" id="ti">SEE ONE <em>IN PERSON</em></div>
  </div>
<script>
window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});
tl.to("#s1",{opacity:1,duration:.7,ease:"power2.inOut"},0)
  .fromTo("#i1",{scale:1.0},{scale:1.12,duration:3.2,ease:"none"},0)
  .to("#s1",{opacity:0,duration:.7,ease:"power2.inOut"},2.6)
  .to("#s2",{opacity:1,duration:.7,ease:"power2.inOut"},2.6)
  .fromTo("#i2",{scale:1.12},{scale:1.0,duration:3.2,ease:"none"},2.6)
  .to("#s2",{opacity:0,duration:.7,ease:"power2.inOut"},5.2)
  .to("#s3",{opacity:1,duration:.7,ease:"power2.inOut"},5.2)
  .fromTo("#i3",{scale:1.0},{scale:1.10,duration:2.8,ease:"none"},5.2)
  .fromTo("#eb",{opacity:0,y:26},{opacity:1,y:0,duration:.6,ease:"power3.out"},.5)
  .fromTo("#ti",{opacity:0,y:36},{opacity:1,y:0,duration:.7,ease:"power3.out"},.7)
  .to(".label",{opacity:0,duration:.5,ease:"power2.in"},7.3);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script>
</div></body></html>
