<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--gold:#D9A441;--black:#0B0B0B;--danger:#E24B4A;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B0B0B}
.bgv{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,11,.72),rgba(11,11,11,.88))}
#root{position:relative;width:1080px;height:1920px;font-family:'Archivo',Arial,sans-serif}
.wrap{position:absolute;left:56px;right:56px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.eyebrow{color:var(--gold);font-weight:700;font-size:32px;letter-spacing:8px;text-transform:uppercase;margin-bottom:22px;text-align:center}
.headline{font-family:'Anton','Arial Black',sans-serif;color:#fff;font-size:86px;line-height:1.04;text-transform:uppercase;text-align:center;margin-bottom:52px}
.headline em{font-style:normal;color:var(--gold)}
.step{display:flex;align-items:flex-start;gap:26px;margin-bottom:34px}
.num{width:66px;height:66px;border-radius:50%;background:var(--gold);color:#0B0B0B;font-family:'Anton',sans-serif;font-size:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step p{color:#fff;font-size:40px;font-weight:700;line-height:1.28}
.step p b{color:var(--gold);font-weight:700}
.eq{margin-top:26px;background:rgba(255,255,255,.06);border-left:8px solid var(--gold);border-radius:0 18px 18px 0;padding:32px 34px}
.eq .l{color:rgba(255,255,255,.6);font-size:28px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.eq .v{font-family:'Anton','Arial Black',sans-serif;color:#fff;font-size:60px;text-transform:uppercase}
.eq .v em{font-style:normal;color:var(--gold)}
.tag{position:absolute;left:0;right:0;bottom:140px;text-align:center;color:var(--gold);font-family:'Anton','Arial Black',sans-serif;font-size:36px;letter-spacing:3px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:26px;margin-bottom:30px}
.tick{width:62px;height:62px;border-radius:50%;background:var(--gold);color:#0B0B0B;font-weight:800;font-size:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tick.warn{background:var(--danger);color:#fff}
.row span{color:#fff;font-size:42px;font-weight:700;line-height:1.25}
</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920" data-duration="10">
  <video id="bgv" class="bgv clip" data-start="0" data-duration="10" data-track-index="0" muted src="assets/bg.mp4"></video>
  <div class="scrim"></div>
  <div class="wrap">
    <div class="eyebrow" id="eb">Sewer &amp; water</div>
    <div class="headline" id="hl">ADD A <em>PRIVATE</em><br>WATER METER</div>
    <div class="row" id="r1"><div class="tick">✓</div><span>Installed inside the ADU</span></div>
    <div class="row" id="r2"><div class="tick">✓</div><span>Meters the ADU's usage on its own</span></div>
    <div class="row" id="r3"><div class="tick">✓</div><span>Keeps the tenant's bill clean</span></div>
    <div class="eq" id="eq">
      <div class="l">Good to know</div>
      <div class="v">OPTIONAL &mdash; <em>IF YOU WANT ONE</em></div>
    </div>
  </div>
  <div class="tag" id="tag">BuildX. Just build baby.</div>
<script>
window.__timelines=window.__timelines||{};var E="power3.out";
var tl=gsap.timeline({paused:true});
tl.fromTo("#eb",{opacity:0,y:28},{opacity:1,y:0,duration:.6,ease:E},.15)
  .fromTo("#hl",{opacity:0,y:40},{opacity:1,y:0,duration:.7,ease:E},.35)
  .fromTo("#r1",{opacity:0,x:-46},{opacity:1,x:0,duration:.55,ease:"back.out(1.3)"},1.0)
  .fromTo("#r2",{opacity:0,x:-46},{opacity:1,x:0,duration:.55,ease:"back.out(1.3)"},1.6)
  .fromTo("#r3",{opacity:0,x:-46},{opacity:1,x:0,duration:.55,ease:"back.out(1.3)"},2.2)
  .fromTo("#eq",{opacity:0,y:34},{opacity:1,y:0,duration:.6,ease:E},2.9)
  .fromTo("#tag",{opacity:0,y:24},{opacity:1,y:0,duration:.6,ease:E},3.4)
  .to(".wrap",{opacity:0,y:-26,duration:.5,ease:"power2.in"},9.2)
  .to("#tag",{opacity:0,duration:.5,ease:"power2.in"},9.2);
window.__timelines["root"]=tl;
if(!window.__hyperframes){tl.play();}
</script></div></body></html>
